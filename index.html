<!doctype html>
<html lang="de-CH">
<head>
<meta charset="utf-8">

<title>Filmabend-Quiz</title>
<style>
:root{
  --bg:#15110e;
  --bg-glow:#2a1c10;
  --surface:#211b17;
  --surface-2:#2b241f;
  --border:#3d332b;
  --text:#f6efe7;
  --muted:#bfb1a2;
  --accent:#f4a340;
  --accent-strong:#ffb95c;
  --accent-ink:#1d1206;
  --accent-soft:rgba(244,163,64,.14);
  --focus:#ffd28f;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 18px 40px rgba(0,0,0,.35);
  --ease:cubic-bezier(.2,.7,.2,1);
  --dur:.28s;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;min-height:100dvh;
  background:radial-gradient(120% 70% at 50% -10%,var(--bg-glow) 0%,var(--bg) 60%) fixed,var(--bg);
  color:var(--text);
  font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
a{color:var(--accent-strong)}
.wrap{max-width:640px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
@media (min-width:900px){.wrap.wide{max-width:980px}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:10px}
h1,h2,h3{line-height:1.2;margin:0}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.45rem}
p{margin:0}

/* Buttons */
.btn{
  appearance:none;border:0;cursor:pointer;font:inherit;font-weight:650;
  display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  min-height:52px;padding:.8em 1.3em;border-radius:999px;text-decoration:none;
  transition:transform var(--dur) var(--ease),background var(--dur),border-color var(--dur);
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-strong)}
.btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent)}
.btn-small{min-height:44px;padding:.55em 1em;font-size:.95rem}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link-btn{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;padding:.6em .2em;min-height:44px;text-decoration:underline;text-underline-offset:3px}
.link-btn:hover{color:var(--text)}

/* Screens */
.screen{animation:fadeIn var(--dur) var(--ease)}
.screen[hidden]{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Start */
.hero{text-align:center;padding:9vh 0 2rem}
.hero-icon{font-size:3rem;line-height:1;margin-bottom:1rem}
.hero h1{font-size:clamp(2.1rem,8vw,3rem)}
.hero p{color:var(--muted);margin:1rem auto 2rem;max-width:30ch;font-size:1.08rem}
.hero .btn{min-width:min(100%,320px)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.panel h2{font-size:1.05rem;margin-bottom:.35rem}
.panel .hint{color:var(--muted);font-size:.92rem;margin-bottom:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  appearance:none;font:inherit;cursor:pointer;min-height:44px;padding:.5em .95em;border-radius:999px;
  background:var(--surface-2);color:var(--text);border:1.5px solid var(--border);display:inline-flex;align-items:center;gap:.45em;
  transition:border-color var(--dur),background var(--dur);
}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chip .tick{width:1.1em;text-align:center;color:var(--accent)}
.start-actions{display:grid;gap:10px;margin-top:1.4rem}
.fineprint{color:var(--muted);font-size:.85rem;margin-top:1.4rem;text-align:center}

/* Quiz */
.quiz-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.counter{color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
.progress{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-bottom:28px}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-strong));border-radius:inherit;transition:width .45s var(--ease)}
.badge{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:.25em .7em;border-radius:999px;margin-bottom:.8rem}
.q-title{font-size:clamp(1.45rem,5.6vw,1.85rem);margin-bottom:.5rem}
.q-sub{color:var(--muted);margin-bottom:1.4rem}
.options{display:grid;gap:10px}
@media (min-width:560px){.options.two-col{grid-template-columns:1fr 1fr}}
.option{
  appearance:none;font:inherit;color:var(--text);text-align:left;cursor:pointer;width:100%;
  display:flex;align-items:center;gap:14px;min-height:64px;padding:14px 16px;
  background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  transition:border-color var(--dur),background var(--dur),transform var(--dur) var(--ease);
}
.option:hover{border-color:#5c4b3d}
.option:active{transform:scale(.99)}
.option[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.option .emo{font-size:1.5rem;width:1.8rem;text-align:center;flex:none}
.option .lbl{font-weight:650;display:block}
.option .desc{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.option .check{margin-left:auto;flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--border);display:grid;place-items:center;color:var(--accent-ink);font-size:.9rem;font-weight:800}
.option[aria-pressed="true"] .check{background:var(--accent);border-color:var(--accent)}
.q-note{color:var(--muted);font-size:.86rem;margin-top:1rem}
.quiz-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:1.5rem}

/* Results */
.res-head{text-align:center;margin:1rem 0 1.4rem}
.res-head .kicker{color:var(--accent);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.82rem}
.res-head h1{font-size:clamp(1.7rem,6vw,2.3rem);margin-top:.3rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-main{border:1.5px solid var(--accent);box-shadow:var(--shadow);background:linear-gradient(180deg,#2a2018 0%,var(--surface) 55%)}
.card-body{padding:20px}
.ribbon{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:.9rem}
.match{font-weight:800;color:var(--accent-strong);font-variant-numeric:tabular-nums}
.title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.6rem,6.4vw,2.1rem)}
.orig{color:var(--muted);font-size:.95rem;margin-top:.25rem}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:.93rem;margin:.8rem 0 1rem}
.meta span{white-space:nowrap}
.desc{margin-bottom:1rem}
.why{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:8px;padding:12px 14px;margin-bottom:1rem}
.why strong{display:block;font-size:.82rem;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-strong);margin-bottom:.2rem}
.platform-note{color:var(--muted);font-size:.92rem;margin:-.3rem 0 1rem}
.pill{display:inline-flex;align-items:center;gap:.4em;font-size:.85rem;font-weight:700;padding:.3em .75em;border-radius:999px;border:1px solid transparent}
.pl-paramount{background:#0b2a66;color:#dfe9ff;border-color:#2e5fd1}
.pl-netflix{background:#4a0b0e;color:#ffe3e4;border-color:#b3121b}
.pl-disney{background:#14234f;color:#e2e8ff;border-color:#3e5ec4}
.pl-youtube{background:#3f0d0d;color:#ffe5e5;border-color:#c4302b}
.avail{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:.4rem}
.avail-type{color:var(--muted);font-size:.9rem}
.ratings{font-size:.93rem;margin:.8rem 0 .2rem}
.ratings b{font-variant-numeric:tabular-nums}
.small{color:var(--muted);font-size:.82rem}
.actions{display:grid;gap:10px;margin-top:1.2rem}
@media (min-width:480px){.actions{grid-template-columns:1fr 1fr}}
.trailer{margin-top:14px}
.trailer-frame{position:relative;aspect-ratio:16/9;border-radius:var(--radius-sm);overflow:hidden;background:#000}
.trailer-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.trailer .small{margin-top:.5rem}
.alts-title{font-size:1.1rem;margin:2rem 0 .8rem}
.alts{display:grid;gap:12px}
@media (min-width:900px){
  .result-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:start}
  .alts-title{margin-top:0}

.card-alt .desc{font-size:.95rem;margin-bottom:.7rem}
.card-alt .why{padding:9px 12px;font-size:.93rem}
.card-alt .actions{grid-template-columns:1fr;margin-top:.8rem}
@media (min-width:480px){.card-alt .actions{grid-template-columns:1fr 1fr}}
.card-alt .btn{min-height:46px;font-size:.92rem;padding:.55em .8em}
.res-foot{margin-top:2rem;display:grid;gap:12px}
details.info{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 16px}
details.info summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:650}
details.info p,details.info ul{color:var(--muted);font-size:.92rem;margin:0 0 .8rem}
details.info ul{padding-left:1.2rem}
.empty{text-align:center;padding:2rem 0}
.empty p{color:var(--muted);margin:.8rem 0 1.4rem}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);padding:.7em 1.1em;border-radius:999px;font-size:.92rem;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity var(--dur)}
.toast.show{opacity:1}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>

/* =====================================================================
   PUNKTESYSTEM
   Jede beantwortete Frage liefert Passungspunkte (pts) und ein Maximum
   (max). Passung % = Summe pts / Summe max. Der Gesamtscore addiert eine
   kleine Qualitätskomponente (IMDb/RT) und einen sehr kleinen
   Plattform-Bonus, der nur bei ähnlich guten Filmen den Ausschlag gibt.
   ===================================================================== */
const SCORERS = {
  mood(f,v){
    if(v==="any") return {pts:10,max:10};
    const hit=f.moods.includes(v);
    return {pts:hit?25:0,max:25,reason:hit?{k:"mood",w:25}:null};
  },
  genre(f,v){
    if(v==="any") return {pts:10,max:10};
    const hit=f.genres.includes(v);
    const main=f.genres[0]===v;
    return {pts:hit?(main?25:20):0,max:25,reason:hit?{k:"genre",w:22}:null};
  },
  intensity(f,v){
    if(v==="any") return {pts:8,max:8};
    const d=Math.abs(f.intensity-Number(v));
    return {pts:d===0?15:d===1?6:-8,max:15,reason:d===0?{k:"intensity",w:12}:null};
  },
  horror(f,v){
    const h=f.horror;
    if(v==="none"){const p=[10,3,-15,-30][h];return {pts:p,max:10,reason:h===0?{k:"noHorror",w:9}:null};}
    if(v==="some"){const p=[7,8,3,-8][h];return {pts:p,max:8,reason:h===1?{k:"someHorror",w:6}:null};}
    const p=[-2,4,12,12][h];return {pts:p,max:12,reason:h>=2?{k:"yesHorror",w:10}:null};
  },
  runtime(f,v){
    const r=f.runtime;
    if(v==="short"){const p=r<=105?10:r<=120?2:-12;return {pts:p,max:10,reason:r<=105?{k:"runtime",w:7}:null};}
    if(v==="medium"){const p=r<=125?8:r<=140?0:-10;return {pts:p,max:8,reason:r<=125?{k:"runtime",w:6}:null};}
    return {pts:5,max:5};
  },
  twist(f,v){
    if(v==="high"){const p=[-6,4,12][f.twist];return {pts:p,max:12,reason:f.twist===2?{k:"twist",w:11}:null};}
    if(v==="some"){const p=[0,5,5][f.twist];return {pts:p,max:5,reason:f.twist>=1?{k:"twistSome",w:4}:null};}
    return {pts:0,max:0};
  },
  tone(f,v){
    if(v==="light"){const p=[10,2,-12][f.serious];return {pts:p,max:10,reason:f.serious===0?{k:"light",w:8}:null};}
    if(v==="serious"){const p=[0,6,6][f.serious];return {pts:p,max:6,reason:f.serious>=1?{k:"serious",w:5}:null};}
    return {pts:0,max:0};
  },
  era(f,v){
    if(v==="new"){const ok=f.year>=2015;return {pts:ok?8:0,max:8,reason:ok?{k:"new",w:5}:null};}
    if(v==="classic"){const ok=f.year<2010;return {pts:ok?8:0,max:8,reason:ok?{k:"classic",w:5}:null};}
    return {pts:0,max:0};
  },
  lang(f,v){
    if(v==="de"){const ok=f.audioDe===true;return {pts:ok?4:0,max:4,reason:ok?{k:"audioDe",w:3}:null};}
    if(v==="ov"){const ok=f.origLang!=="en";return {pts:ok?3:0,max:3,reason:ok?{k:"ov",w:3}:null};}
    return {pts:0,max:0};
  }
};

function qualityScore(f){
  let q=(f.imdb-6.5)*4;
  if(f.rt!=null&&f.rt>=90) q+=1.5;
  return q;
}

function primaryAvailability(f,platforms){
  const opts=f.availability.filter(a=>platforms.includes(a.platform))
    .sort((a,b)=>PLATFORMS[a.platform].prio-PLATFORMS[b.platform].prio);
  return opts;
}

function scoreFilm(f,answers,platforms){
  const avail=primaryAvailability(f,platforms);
  if(!avail.length) return null;
  let pts=0,max=0;const reasons=[];
  for(const q in SCORERS){
    if(answers[q]==null) continue;
    const r=SCORERS[q](f,answers[q]);
    pts+=r.pts;max+=r.max;
    if(r.reason) reasons.push(r.reason);
  }
  const fit=max>0?Math.max(0,Math.min(1,pts/max)):0.5;
  const plat=PLATFORMS[avail[0].platform];
  const total=pts+qualityScore(f)+plat.bonus;
  return {film:f,fit,pts,total,avail,platform:avail[0].platform,reasons};
}

function rankFilms(answers,platforms,seen){
  return FILMS.map(f=>scoreFilm(f,answers,platforms))
    .filter(r=>r&&!seen.includes(r.film.id))
    .sort((a,b)=> b.total-a.total || PLATFORMS[a.platform].prio-PLATFORMS[b.platform].prio);
}

const STORE_KEY="filmabend-quiz-v1";
const state={
  path:[],          // beantwortete Fragen in Reihenfolge
  answers:{},       // q -> Antwort (auch nach "Zurück" für Vorauswahl erhalten)
  current:null,     // aktuelle Frage
  seenDraft:[],     // Auswahl in der "schon gesehen"-Frage
  seen:[],          // bestätigt gesehene Filme
  platforms:["paramount","netflix","disney","youtube"],
  view:"start",
  hasResult:false
};

function save(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){/* Speicher nicht verfügbar */}
}
function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const s=JSON.parse(raw);
    if(s&&typeof s==="object"){
      ["path","answers","current","seenDraft","seen","platforms","view","hasResult"].forEach(k=>{if(k in s) state[k]=s[k];});
      state.platforms=(state.platforms||[]).filter(p=>p in PLATFORMS);
      if(!state.platforms.length) state.platforms=Object.keys(PLATFORMS);
    }
  }catch(e){/* ungültige Daten ignorieren */}
}

function activeAnswers(){
  const a={};
  state.path.forEach(q=>{ if(q!=="seen") a[q]=state.answers[q]; });
  return a;
}

/* ---------- Ablaufsteuerung ---------- */
function needsHorrorQuestion(a){
  return a.genre==="spooky"||a.genre==="any"||["dark","nerve","surprise","any"].includes(a.mood)||a.intensity==="3";
}
function implicitAnswers(a){
  // Wird die Horror-Frage übersprungen, gehen wir von "etwas Nervenkitzel ok" aus.
  const out=Object.assign({},a);
  if(out.horror==null && a.runtime!=null && !needsHorrorQuestion(a)) out.horror="some";
  return out;
}

function attrFor(q,f){
  if(q==="twist") return f.twist;
  if(q==="tone") return f.serious;
  if(q==="era") return f.year>=2015?1:(f.year<2010?-1:0);
  if(q==="lang") return (f.audioDe?1:0)+(f.origLang!=="en"?1:0);
  return 0;
}
function variance(arr){
  if(arr.length<2) return 0;
  const m=arr.reduce((s,x)=>s+x,0)/arr.length;
  return arr.reduce((s,x)=>s+(x-m)*(x-m),0)/arr.length;
}

function isConvincing(ranking){
  if(ranking.length<3) return true;
  const [a,,c]=ranking;
  return a.fit>=0.72 && (a.total-c.total)>=5;
}

function pickFollowup(ranking,asked){
  const top=ranking.slice(0,6).map(r=>r.film);
  let best=null,bestVar=0.05;
  FOLLOWUPS.forEach(q=>{
    if(asked.includes(q)) return;
    const v=variance(top.map(f=>attrFor(q,f)));
    if(v>bestVar){bestVar=v;best=q;}
  });
  return best;
}

function nextQuestion(){
  const a=activeAnswers();
  const p=state.path;
  if(!p.includes("mood")) return "mood";
  if(!p.includes("genre")) return "genre";
  if(!p.includes("intensity")) return "intensity";
  if(!p.includes("horror") && needsHorrorQuestion(a)) return "horror";
  if(!p.includes("runtime")) return "runtime";
  if(p.includes("seen")) return null;
  const asked=p.filter(q=>FOLLOWUPS.includes(q));
  if(asked.length<MAX_FOLLOWUPS){
    const ranking=rankFilms(implicitAnswers(a),state.platforms,[]);
    if(!isConvincing(ranking)){
      const f=pickFollowup(ranking,asked);
      if(f) return f;
    }
  }
  return "seen";
}

function plannedTotal(){
  const a=activeAnswers();
  let n=4; // mood, genre, intensity, runtime
  if(state.path.includes("genre")){ if(needsHorrorQuestion(a)||state.path.includes("horror")) n++; }
  else n++; // vor Frage 2 noch unklar -> mit 6 rechnen
  const fu=state.path.filter(q=>FOLLOWUPS.includes(q)).length+(FOLLOWUPS.includes(state.current)?1:0);
  return n+fu+1; // +1 für "schon gesehen"
}

/* =====================================================================
   RENDERING
   ===================================================================== */
const $=(s)=>document.querySelector(s);
const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const reduceMotion=()=>window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function fmtRuntime(m){const h=Math.floor(m/60),r=m%60;return h?`${h} h${r?" "+r+" min":""}`:`${r} min`;}
function fmtDate(iso){const [y,m,d]=iso.split("-");return `${d}.${m}.${y}`;}

function showScreen(name){
  ["start","quiz","result"].forEach(n=>{ $("#screen-"+n).hidden = n!==name; });
  $("#wrap").classList.toggle("wide",name==="result");
  state.view=name;
  save();
  window.scrollTo(0,0);
}

function toast(msg){
  const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2200);
}

/* ---------- Start ---------- */
function renderPlatformChips(){
  const wrap=$("#platform-chips");
  wrap.innerHTML="";
  Object.keys(PLATFORMS).sort((a,b)=>PLATFORMS[a].prio-PLATFORMS[b].prio).forEach(k=>{
    const on=state.platforms.includes(k);
    const b=document.createElement("button");
    b.type="button";b.className="chip";b.setAttribute("aria-pressed",String(on));
    b.innerHTML=`<span class="tick" aria-hidden="true">${on?"✓":""}</span>${PLATFORMS[k].prio}. ${esc(PLATFORMS[k].name)}`;
    b.addEventListener("click",()=>{
      const sel=state.platforms.includes(k);
      if(sel && state.platforms.length===1){toast("Mindestens eine Plattform muss aktiv sein.");return;}
      state.platforms= sel? state.platforms.filter(x=>x!==k) : state.platforms.concat(k);
      save();renderPlatformChips();
    });
    wrap.appendChild(b);
  });
}
function renderStart(){
  renderPlatformChips();
  $("#resume-wrap").hidden=!state.hasResult;
  showScreen("start");
  $("#start-title").focus({preventScroll:true});
}

/* ---------- Quiz ---------- */
function resolve(v){return typeof v==="function"?v(activeAnswers()):v;}

function renderQuestion(){
  const qid=state.current;
  const q=QUESTIONS[qid];
  const total=plannedTotal();
  const num=state.path.length+1;
  $("#q-counter").textContent=`Frage ${num} von ${total}`;
  const pct=Math.round(((num-1)/total)*100);
  $("#progress-bar").style.width=pct+"%";
  $("#progress").setAttribute("aria-valuenow",String(pct));
  $("#btn-back").hidden=state.path.length===0;

  const area=$("#q-area");
  let html="";
  if(q.followup) html+=`<span class="badge">Zusatzfrage</span>`;
  html+=`<h2 class="q-title" id="q-title" tabindex="-1">${esc(resolve(q.title))}</h2>`;
  html+=`<p class="q-sub">${esc(resolve(q.sub))}</p>`;

  if(q.multi){
    const ranking=rankFilms(implicitAnswers(activeAnswers()),state.platforms,state.seen).slice(0,8);
    html+=`<div class="options two-col" role="group" aria-label="Filme, die ihr schon gesehen habt">`;
    ranking.forEach(r=>{
      const on=state.seenDraft.includes(r.film.id);
      html+=`<button type="button" class="option" data-film="${esc(r.film.id)}" aria-pressed="${on}">
        <span><span class="lbl">${esc(r.film.title)}</span><span class="desc">${r.film.year} · ${esc(PLATFORMS[r.platform].name)}</span></span>
        <span class="check" aria-hidden="true">${on?"✓":""}</span></button>`;
    });
    html+=`</div><p class="q-note">${esc(q.note)}</p>`;
    $("#btn-next").hidden=false;
    $("#btn-next").textContent="Ergebnis zeigen";
  }else{
    const opts=resolve(q.options);
    html+=`<div class="options${q.twoCol?" two-col":""}" role="group" aria-labelledby="q-title">`;
    opts.forEach(o=>{
      const on=state.answers[qid]===o.v;
      html+=`<button type="button" class="option" data-v="${esc(o.v)}" aria-pressed="${on}">
        <span class="emo" aria-hidden="true">${o.e||""}</span>
        <span><span class="lbl">${esc(o.l)}</span>${o.d?`<span class="desc">${esc(o.d)}</span>`:""}</span></button>`;
    });
    html+=`</div>`;
    $("#btn-next").hidden=true;
  }
  area.innerHTML=html;

  area.querySelectorAll(".option").forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(q.multi){
        const id=btn.dataset.film;
        state.seenDraft= state.seenDraft.includes(id)? state.seenDraft.filter(x=>x!==id) : state.seenDraft.concat(id);
        const on=state.seenDraft.includes(id);
        btn.setAttribute("aria-pressed",String(on));
        btn.querySelector(".check").textContent=on?"✓":"";
        save();
      }else{
        area.querySelectorAll(".option").forEach(b=>b.setAttribute("aria-pressed","false"));
        btn.setAttribute("aria-pressed","true");
        answer(qid,btn.dataset.v);
      }
    });
  });

  area.classList.remove("screen");void area.offsetWidth;area.classList.add("screen");
  $("#q-title").focus({preventScroll:true});
}

let advancing=false;
function answer(qid,v){
  if(advancing) return;
  advancing=true;
  state.answers[qid]=v;
  state.path.push(qid);
  save();
  setTimeout(()=>{advancing=false;goNext();}, reduceMotion()?0:170);
}

function goNext(){
  const n=nextQuestion();
  if(n==="seen"||n==null){
    if(n==null){ showResult(); return; }
  }
  state.current=n;
  save();
  renderQuestion();
}

function goBack(){
  if(!state.path.length){renderStart();return;}
  const prev=state.path.pop();
  if(prev==="seen"){ state.seen=[]; }
  state.current=prev;
  state.hasResult=false;
  save();
  showScreen("quiz");
  renderQuestion();
}

function startQuiz(){
  state.path=[];state.answers={};state.seen=[];state.seenDraft=[];state.hasResult=false;
  state.current="mood";
  save();
  showScreen("quiz");
  renderQuestion();
}

function finishSeen(){
  state.seen=state.seenDraft.slice();
  if(!state.path.includes("seen")) state.path.push("seen");
  showResult();
}

/* ---------- Ergebnis ---------- */
const REASON_TEXT={
  intensity:(f)=>["ist angenehm entspannt anzuschauen","hält die Spannung auf einem guten Mittelmass","packt richtig zu"][f.intensity-1],
  noHorror:()=>"kommt ohne Horror-Schocks aus",
  someHorror:()=>"bietet etwas Nervenkitzel, ohne in Horror abzurutschen",
  yesHorror:()=>"liefert die gewünschte Portion Grusel",
  runtime:(f)=>`passt mit ${fmtRuntime(f.runtime)} gut in euren Abend`,
  twist:()=>"lebt von einer starken Wendung",
  twistSome:()=>"hält die eine oder andere Überraschung bereit",
  light:()=>"bleibt thematisch angenehm leicht",
  serious:()=>"traut sich auch an ernstere Themen",
  new:(f)=>`ist aus dem Jahr ${f.year} und damit angenehm frisch`,
  classic:(f)=>`ist ein Klassiker von ${f.year}`,
  audioDe:()=>"hat laut JustWatch CH auf unserer Plattform eine deutsche Tonspur",
  ov:()=>"lohnt sich besonders im Originalton"
};
function joinDe(parts){
  if(parts.length<=1) return parts.join("");
  return parts.slice(0,-1).join(", ")+" und "+parts[parts.length-1];
}
function whyText(r,answers){
  const f=r.film;
  const keys=r.reasons.slice().sort((a,b)=>b.w-a.w).map(x=>x.k);
  const lead=[];
  if(keys.includes("mood")) lead.push(`„${LABELS.mood[answers.mood]}“`);
  if(keys.includes("genre")) lead.push(`„${LABELS.genre[answers.genre]}“`);
  let s1="";
  if(lead.length) s1=`Ihr wolltet es ${joinDe(lead)} – genau das liefert dieser Film.`;
  const rest=keys.filter(k=>REASON_TEXT[k]).slice(0,lead.length?2:3).map(k=>REASON_TEXT[k](f));
  let s2="";
  if(rest.length) s2=`Er ${joinDe(rest)}.`;
  if(!s1&&!s2) s2=`Er ist unter euren Vorgaben der stimmigste Kompromiss und mit IMDb ${f.imdb.toFixed(1)} gut bewertet.`;
  return (s1+" "+s2).trim();
}
function shortWhy(r,answers){
  const f=r.film;
  const k=r.reasons.slice().sort((a,b)=>b.w-a.w).map(x=>x.k);
  const bits=[];
  if(k.includes("mood")) bits.push(LABELS.mood[answers.mood]);
  if(k.includes("genre")) bits.push(LABELS.genre[answers.genre]);
  if(k.includes("noHorror")) bits.push("ohne Horror");
  if(k.includes("yesHorror")) bits.push("schön gruselig");
  if(k.includes("twist")) bits.push("mit Wendung");
  if(k.includes("runtime")) bits.push(fmtRuntime(f.runtime));
  return bits.length? "Passt, weil: "+bits.slice(0,4).join(" · ") : "Solide Alternative mit ähnlicher Stimmung.";
}

function availType(a){
  if(a.platform==="youtube"){
    if(a.type==="free") return "kostenlos auf YouTube";
    if(a.type==="rent") return "zum Ausleihen"+(a.price?` (${a.price})`:"");
    if(a.type==="buy") return "zum Kaufen"+(a.price?` (${a.price})`:"");
  }
  return "im Abo enthalten";
}
function watchLink(f,a){
  if(a.url) return a.url;
  if(a.platform==="netflix") return "https://www.netflix.com/search?q="+encodeURIComponent(f.originalTitle||f.title);
  return "https://www.justwatch.com/ch/Film/"+encodeURIComponent(f.justwatch);
}
function jwLink(f){return "https://www.justwatch.com/ch/Film/"+encodeURIComponent(f.justwatch);}

function platformNote(main,answers){
  const p=PLATFORMS[main.platform].prio;
  const higher=state.platforms.filter(k=>PLATFORMS[k].prio<p).sort((a,b)=>PLATFORMS[a].prio-PLATFORMS[b].prio);
  if(!higher.length) return "";
  const ranking=rankFilms(answers,state.platforms,state.seen);
  const parts=[];
  higher.forEach(k=>{
    const best=ranking.find(r=>r.platform===k);
    if(best) parts.push(`${PLATFORMS[k].name} (bester Treffer: ${best.film.title}, ${Math.round(best.fit*100)} %)`);
    else parts.push(`${PLATFORMS[k].name} (kein passender Film in der Auswahl)`);
  });
  if(!parts.length) return "";
  return `Warum ${PLATFORMS[main.platform].name}? Auf ${joinDe(parts)} passte heute nichts ähnlich gut zu euren Antworten.`;
}

function ratingsHtml(f){
  const bits=[`IMDb <b>${f.imdb.toFixed(1)}</b>/10`];
  if(f.rt!=null) bits.push(`Rotten Tomatoes <b>${f.rt} %</b>`);
  return `<p class="ratings">${bits.join(" · ")}</p>`;
}

function filmCard(r,answers,isMain){
  const f=r.film;
  const prim=r.avail[0];
  const plat=PLATFORMS[prim.platform];
  const also=r.avail.slice(1).map(a=>PLATFORMS[a.platform].name);
  const meta=[`<span>${f.year}</span>`,`<span>${esc(f.genreLabel)}</span>`,`<span>${fmtRuntime(f.runtime)}</span>`];
  if(f.fsk!=null) meta.push(`<span>FSK ${f.fsk}</span>`);
  const trailerBtn = f.trailerId
    ? `<button type="button" class="btn btn-ghost btn-small" data-trailer="${esc(f.trailerId)}" data-title="${esc(f.title)}" aria-expanded="false">▶ Trailer ansehen</button>`
    : `<a class="btn btn-ghost btn-small" href="https://www.youtube.com/results?search_query=${encodeURIComponent(f.title+" "+f.year+" offizieller Trailer")}" target="_blank" rel="noopener">▶ Trailer auf YouTube suchen</a>`;
  const note = isMain? platformNote(r,answers) : "";
  return `
  <article class="card ${isMain?"card-main":"card-alt"}" aria-labelledby="t-${esc(f.id)}">
    <div class="card-body">
      <div class="ribbon">
        <span class="pill ${plat.cls}">${esc(plat.name)}</span>
        <span class="match">${Math.round(r.fit*100)} % Passung</span>
      </div>
      <h${isMain?2:3} class="title" id="t-${esc(f.id)}">${esc(f.title)}</h${isMain?2:3}>
      ${f.originalTitle?`<p class="orig">Originaltitel: ${esc(f.originalTitle)}</p>`:""}
      <div class="meta">${meta.join("")}</div>
      <p class="desc">${esc(f.desc)}</p>
      <div class="why">${isMain?`<strong>Darum passt er zu euch</strong>${esc(whyText(r,answers))}`:esc(shortWhy(r,answers))}</div>
      ${note?`<p class="platform-note">${esc(note)}</p>`:""}
      <div class="avail"><span class="avail-type">${esc(plat.name)} · ${esc(availType(prim))}${also.length?` · auch auf ${esc(also.join(", "))}`:""}</span></div>
      ${ratingsHtml(f)}
      <p class="small">Bewertungen: ${RATING_SOURCE}, abgerufen am ${fmtDate(CHECKED)} – sie können sich ändern.${f.fsk!=null?" Altersfreigabe laut JustWatch CH.":""}</p>
      <p class="small">Verfügbarkeit zuletzt geprüft am ${fmtDate(f.availabilityChecked)}${f.audioDe?" · deutsche Tonspur bestätigt":""}</p>
      <div class="actions">
        <a class="btn btn-primary btn-small" href="${esc(watchLink(f,prim))}" target="_blank" rel="noopener">Jetzt auf ${esc(plat.name)} ansehen</a>
        ${trailerBtn}
      </div>
      ${prim.platform!=="netflix"&&!prim.url?`<p class="small" style="margin-top:.6rem">Der Link führt über die Schweizer JustWatch-Seite zum Angebot.</p>`:""}
      <div class="trailer" hidden></div>
      ${isMain?`<div style="margin-top:.8rem;text-align:center"><button type="button" class="link-btn" data-seen="${esc(f.id)}">Kennen wir schon – anderer Vorschlag</button></div>`:""}
    </div>
  </article>`;
}

function showResult(){
  const answers=implicitAnswers(activeAnswers());
  const ranking=rankFilms(answers,state.platforms,state.seen);
  state.hasResult=true;
  state.current=null;
  showScreen("result");
  const area=$("#res-area");
  if(!ranking.length){
    area.innerHTML=`<div class="empty"><h1 id="res-title" tabindex="-1">Keine Treffer mehr</h1>
      <p>Mit euren Plattformen und den bereits gesehenen Filmen bleibt in unserer Auswahl nichts übrig.</p>
      <button type="button" class="btn btn-primary" id="btn-restart-empty">Quiz neu starten</button></div>`;
    $("#btn-restart-empty").addEventListener("click",restart);
    $("#res-title").focus({preventScroll:true});
    return;
  }
  const [main,...rest]=ranking;
  const alts=rest.slice(0,2);
  const weak=main.fit<0.6;
  area.innerHTML=`
    <header class="res-head">
      <p class="kicker">Euer Film für heute</p>
      <h1 id="res-title" tabindex="-1">Popcorn bereit? Das hier passt.</h1>
      ${weak?`<p class="small" style="margin-top:.6rem">Eure Wünsche waren heute anspruchsvoll – das ist der beste Kompromiss aus unserer Auswahl.</p>`:""}
    </header>
    <div class="result-grid">
      <div>${filmCard(main,answers,true)}</div>
      <div>
        ${alts.length?`<h2 class="alts-title">Zwei Alternativen</h2><div class="alts">${alts.map(r=>filmCard(r,answers,false)).join("")}</div>`:""}
      </div>
    </div>
    <div class="res-foot">
      <details class="info">
        <summary>Wie kommt die Empfehlung zustande?</summary>
        <p>Jeder Film bekommt Punkte für Stimmung, Genre, Intensität, Horror-Anteil, Laufzeit und – falls gefragt – Wendung, Tonfall, Erscheinungsjahr oder Sprache. „Passung“ zeigt, wie viele der möglichen Punkte ein Film erreicht.</p>
        <p>Dazu kommt ein kleiner Qualitätsbonus aus der IMDb-Wertung. Die Plattform zählt nur als Feinabstimmung (Paramount+ vor Netflix vor Disney+ vor YouTube), damit Verfügbarkeit allein keinen Film nach vorne bringt. Bereits gesehene Filme werden nicht vorgeschlagen.</p>
      </details>
      <details class="info">
        <summary>Hinweise zu Daten und Verfügbarkeit</summary>
        <ul>
          <li>Verfügbarkeit, Laufzeit, Altersfreigabe und Bewertungen wurden am ${fmtDate(CHECKED)} auf JustWatch Schweiz geprüft. Diese Seite aktualisiert sich nicht automatisch – Angebote können sich inzwischen geändert haben.</li>
          <li>YouTube: JustWatch CH listet für keinen Film dieser Auswahl ein YouTube-Angebot. Kostenlose, Leih- oder Kaufangebote auf YouTube wurden deshalb nicht eingetragen und es werden keine Preise angezeigt.</li>
          <li>Untertitel wurden nicht geprüft. Deutsche Tonspuren nur dort, wo JustWatch CH sie ausdrücklich listet.</li>
          <li>Trailer werden nur eingebettet, wenn das Video als offizieller Trailer auf dem Kanal des Studios bestätigt ist; sonst öffnet sich eine YouTube-Suche. Eingebettet wird über youtube-nocookie.com, erst nach eurem Klick und ohne Autoplay.</li>
        </ul>
      </details>
      <button type="button" class="btn btn-ghost btn-block" id="btn-back-result">← Antworten ändern</button>
      <button type="button" class="btn btn-primary btn-block" id="btn-restart">Quiz neu starten</button>
    </div>`;

  area.querySelectorAll("[data-trailer]").forEach(b=>b.addEventListener("click",()=>toggleTrailer(b)));
  area.querySelectorAll("[data-seen]").forEach(b=>b.addEventListener("click",()=>{
    state.seen=state.seen.concat(b.dataset.seen);
    if(!state.seenDraft.includes(b.dataset.seen)) state.seenDraft.push(b.dataset.seen);
    save();
    showResult();
    toast("Alles klar – hier ist ein anderer Vorschlag.");
  }));
  $("#btn-restart").addEventListener("click",restart);
  $("#btn-back-result").addEventListener("click",goBack);
  save();
  $("#res-title").focus({preventScroll:true});
}

function toggleTrailer(btn){
  const box=btn.closest(".card-body").querySelector(".trailer");
  const open=btn.getAttribute("aria-expanded")==="true";
  if(open){
    box.innerHTML="";box.hidden=true;
    btn.setAttribute("aria-expanded","false");btn.textContent="▶ Trailer ansehen";
    return;
  }
  const id=btn.dataset.trailer;
  const title=btn.dataset.title;
  // Kein autoplay-Parameter: Das Video startet erst, wenn ihr im Player auf Play drückt.
  box.innerHTML=`<div class="trailer-frame"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?rel=0"
      title="Offizieller Trailer: ${esc(title)}" loading="lazy"
      allow="encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
    <p class="small">Wird „Video nicht verfügbar“ angezeigt? Manche Trailer dürfen nicht eingebettet werden –
      <a href="https://www.youtube.com/watch?v=${encodeURIComponent(id)}" target="_blank" rel="noopener">Trailer direkt auf YouTube öffnen</a>.</p>`;
  box.hidden=false;
  btn.setAttribute("aria-expanded","true");btn.textContent="✕ Trailer schliessen";
}

function restart(){
  state.path=[];state.answers={};state.seen=[];state.seenDraft=[];state.current=null;state.hasResult=false;
  save();
  startQuiz();
}

/* ---------- Init ---------- */
function init(){
  load();
  $("#btn-start").addEventListener("click",startQuiz);
  $("#btn-resume").addEventListener("click",showResult);
  $("#btn-back").addEventListener("click",goBack);
  $("#btn-restart-quiz").addEventListener("click",restart);
  $("#btn-next").addEventListener("click",()=>{ if(state.current==="seen") finishSeen(); });
  if(state.view==="quiz"&&state.current&&QUESTIONS[state.current]){showScreen("quiz");renderQuestion();}
  else if(state.view==="result"&&state.hasResult){showResult();}
  else renderStart();
}
init();
</script>
